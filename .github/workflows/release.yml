# Publishes the newest notarized iOS build: fetches its Alternative Distribution
# Package through AltStore, uploads the files as a GitHub release, and commits
# the new version to AltStore/source.json, which AltStore PAL users subscribe to.
# Then builds the Mac app at the same version, signs it with Developer ID,
# notarizes it, and attaches it to that release.
#
# Runs by itself every 3 hours: a short `check` job asks whether the newest
# notarized build has no release yet and AltStore has finished processing it,
# and only then does the release run, so publishing needs no action once a build
# is notarized. Running it by hand skips the check and waits up to 30 minutes
# for AltStore instead. Re-running is safe: an existing release is reused and an
# unchanged source is not committed.
#
# GitHub pauses scheduled workflows after 60 days without commits; each release
# commits AltStore/source.json, but after a quiet spell re-enable it under
# Actions › Release.
#
# Needs repository secrets ASC_ISSUER_ID, ASC_KEY_ID and ASC_PRIVATE_KEY (the
# .p8 file's contents), and repository variables TUIST_BUNDLE_ID,
# TUIST_DEVELOPMENT_TEAM, DEVELOPER_NAME and PRIVACY_POLICY_URL (the same values
# as in Local.env). Signing the Mac app needs the Developer ID Application
# certificate as secrets DEVELOPER_ID_P12 (the exported .p12, base64-encoded)
# and DEVELOPER_ID_P12_PASSWORD: Apple's cloud-managed Developer ID signing
# refuses App Store Connect API keys, even Admin ones (FB16835802).
name: Release

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, off the hour to avoid GitHub's busiest minute.
    - cron: "17 */3 * * *"

permissions:
  # Create the release and push the updated source.
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # Scheduled runs only; a manual run goes straight to the release.
    if: github.event_name == 'schedule'
    # The script needs CryptoKit, so macOS. It doesn't wait, so it is short.
    runs-on: macos-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: check
        run: make release-check
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TUIST_BUNDLE_ID: ${{ vars.TUIST_BUNDLE_ID }}
          GH_TOKEN: ${{ github.token }}

  release:
    needs: check
    # always(): a manual run skips `check`, and a skipped dependency would
    # otherwise skip this job too.
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (needs.check.result == 'success' && needs.check.outputs.ready == 'true'))
    # The script needs CryptoKit and ditto, so macOS.
    runs-on: macos-latest
    # Waits for App Store Connect and AltStore can each take up to 30 minutes.
    timeout-minutes: 75
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
      build: ${{ steps.publish.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Publish release
        id: publish
        run: make release
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TUIST_BUNDLE_ID: ${{ vars.TUIST_BUNDLE_ID }}
          DEVELOPER_NAME: ${{ vars.DEVELOPER_NAME }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
          GH_TOKEN: ${{ github.token }}

      - name: Commit source
        run: |
          git add AltStore/source.json
          if git diff --cached --quiet; then
            echo "AltStore/source.json is unchanged."
            exit 0
          fi
          version=$(jq -r '.apps[0].versions[0] | "\(.version) (\(.buildVersion))"' AltStore/source.json)
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Add Skein $version to the AltStore source"
          git push origin HEAD:main

  macos:
    needs: release
    # Explicit, because `check` is skipped on manual runs and GitHub otherwise
    # skips every job downstream of a skipped one.
    if: always() && needs.release.result == 'success'
    runs-on: macos-latest
    # A cold build compiles libtorrent and, without a cache hit, OpenSSL.
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check for an existing Mac build
        id: existing
        run: |
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -q -- '-macOS\.zip$'; then
            echo "Release $RELEASE_TAG already has a Mac build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.existing.outputs.skip != 'true'
        with:
          xcode-version: latest-stable

      - name: Install Tuist
        if: steps.existing.outputs.skip != 'true'
        run: brew install tuist

      # Both are slow to produce and change only when their scripts do.
      - uses: actions/cache@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          path: Vendor/boost
          key: boost-${{ hashFiles('Scripts/bootstrap.sh') }}
      - uses: actions/cache@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          path: Vendor/openssl
          key: openssl-${{ hashFiles('Scripts/build-openssl.sh') }}

      - name: Fetch dependencies
        if: steps.existing.outputs.skip != 'true'
        run: make bootstrap openssl

      # A throwaway keychain holding only the Developer ID certificate.
      - name: Import Developer ID certificate
        if: steps.existing.outputs.skip != 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Build, notarize and attach
        if: steps.existing.outputs.skip != 'true'
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          make mac-release ASC_PRIVATE_KEY_PATH="$key" \
            VERSION="${{ needs.release.outputs.version }}" BUILD_NUMBER="${{ needs.release.outputs.build }}"
          rm -f "$key"
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TUIST_BUNDLE_ID: ${{ vars.TUIST_BUNDLE_ID }}
          TUIST_DEVELOPMENT_TEAM: ${{ vars.TUIST_DEVELOPMENT_TEAM }}

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
